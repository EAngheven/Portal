<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5A47">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis impuestos">
<title>Mis impuestos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--c:#1E5A47;--c2:#123A2E;--c3:#E6F0EA;--ink:#17231E;--ink2:#4A5A53;--ink3:#66756F;--rule:#DCE6E0;--bg:#F3F6F4;--card:#fff;--ok:#1E7B4F;--okb:#E3F2EA;--warn:#7A4F00;--warnb:#FBF1DC;--bad:#B42318;--badb:#FBEAE8;--info:#2A5DB0;--infob:#E8EEF7;--mute:#4A5A53;--muteb:#ECEFEE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer}
a{color:var(--c)}
.cab{background:var(--c2);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 18px}
.marca{display:flex;align-items:center;gap:10px;font-size:14px;opacity:.95}
.marca img{height:30px;max-width:110px;border-radius:5px;background:#fff;padding:2px;object-fit:contain}
.cliente{margin-top:12px}
.cliente b{display:block;font-size:19px;line-height:1.25}
.cliente span{font-size:13px;opacity:.85;letter-spacing:.3px}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;opacity:.9}
.act button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;font-size:13px}
main{padding:14px 14px 8px;max-width:640px;margin:0 auto}
.tarj{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(18,58,46,.05)}
.tarj h2{font-size:15px;color:var(--ink2);font-weight:600;margin-bottom:8px}
.grande{font-size:32px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.15}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.warn{background:var(--warnb);color:var(--warn)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.info{background:var(--infob);color:var(--info)}.chip.mute{background:var(--muteb);color:var(--mute)}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.fila:first-of-type{border-top:0}
.fila span{color:var(--ink2)}
.fila b{font-variant-numeric:tabular-nums;white-space:nowrap}
.vence{margin:8px 0 10px;font-size:14.5px;color:var(--ink2)}
.vence b{color:var(--ink)}
.nota{font-size:13.5px;color:var(--ink2);margin-top:8px}
.mes{width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:block;color:var(--ink)}
.mes-c{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mes-c b{font-size:16.5px;text-transform:capitalize}
.mes-c strong{font-variant-numeric:tabular-nums;font-size:17px}
.mes-d{margin-top:10px;border-top:1px dashed var(--rule);padding-top:6px}
.mes-d h3{font-size:13.5px;color:var(--ink3);margin:10px 0 2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.aviso{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.aviso:first-of-type{border-top:0}
.aviso i{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.aviso i.alta{background:var(--badb);color:var(--bad)}.aviso i.media{background:var(--warnb);color:var(--warn)}
.aviso b{display:block;font-size:15px}
.aviso p{font-size:13.5px;color:var(--ink2)}
.aviso em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums}
.contacto{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.contacto a{flex:1 1 120px;text-align:center;text-decoration:none;border:1px solid var(--c);color:var(--c);border-radius:12px;padding:11px 10px;font-weight:600}
.contacto a.wa{background:var(--c);color:#fff}
.graf{width:100%;height:auto;margin:4px 0 6px}
.leyenda{display:flex;gap:14px;font-size:13px;color:var(--ink2)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{background:none;border:0;padding:9px 4px 10px;color:var(--ink3);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--c);font-weight:700}
.vacio{text-align:center;color:var(--ink3);padding:26px 10px}
.pie{text-align:center;font-size:12.5px;color:var(--ink3);padding:6px 16px 18px}
.entrar{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;max-width:440px;margin:0 auto}
.entrar .logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--c2);font-weight:600}
.entrar .logo img{height:42px;max-width:150px;object-fit:contain}
.entrar h1{font-size:25px;color:var(--c2);margin-bottom:6px}
.entrar p{color:var(--ink2);margin-bottom:18px}
.entrar label{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
.entrar input[type=text],.entrar input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid #B8C6BF;border-radius:12px;background:#fff;color:var(--ink);letter-spacing:.5px}
.entrar input:focus{outline:3px solid var(--c3);border-color:var(--c)}
.recordar{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:15px;color:var(--ink2)}
.recordar input{width:20px;height:20px}
.btn-pri{width:100%;margin-top:16px;background:var(--c);color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700}
.btn-pri[disabled]{opacity:.6}
.error{color:var(--bad);font-weight:600;margin-top:12px;min-height:1.4em}
.salir{background:none;border:0;color:var(--c);text-decoration:underline;font-size:14px;margin-top:4px}
.previa{background:var(--warnb);color:var(--warn);text-align:center;font-size:13px;font-weight:600;padding:6px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--c2);color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sinred{background:var(--muteb);color:var(--mute);text-align:center;font-size:13px;padding:5px}
</style>
</head>

async function salir(msg) { SES = null; DATOS = null; await DBP.set('sesion', null); try { localStorage.removeItem('ea-portal-copia'); } catch (e) { /* nada */ } pintarEntrada(msg); }
async function refrescar(avisar) {

function mesActual() { const M = DATOS.meses || []; return M.find(m => m.estado !== 'presentada' && m.total > 0) || M[0] || null; }

function vistaInicio() {

function avisoHTML(a) { return `<div class="aviso"><i class="${a.sev === 'alta' ? 'alta' : 'media'}" aria-label="Importancia ${a.sev}">!</i><div><b>${esc(a.t)}</b><p>${esc(a.d)}</p>${a.m ? `<p><em>${dinero(a.m)}</em></p>` : ''}</div></div>`; }
function vistaImpuestos() {

function vistaIngresos() {

  const barras = F.map((f, i) => { const x = 30 + i * paso + paso / 2, h1 = f.fact / max * (H - 34), h2 = f.gas / max * (H - 34); return `<rect x="${(x - bw - 1).toFixed(1)}" y="${(H - 20 - h1).toFixed(1)}" width="${bw.toFixed(1)}" height="${h1.toFixed(1)}" rx="3" fill="var(--c)"/><rect x="${(x + 1).toFixed(1)}" y="${(H - 20 - h2).toFixed(1)}" width="${bw.toFixed(1)}" height="${h2.toFixed(1)}" rx="3" fill="#C9A227"/><text x="${x.toFixed(1)}" y="${H - 5}" font-size="10.5" text-anchor="middle" fill="#66756F">${MESES[+f.per.slice(5, 7) - 1].slice(0, 3)}</text>`; }).join('');

    <div class="leyenda"><span><i style="background:var(--c)"></i>Ingresos facturados</span><span><i style="background:#C9A227"></i>Gastos facturados</span></div></section>
    <section class="tarj"><h2>Por mes (sin IVA)</h2>${F.slice().reverse().map(f => `<div class="fila"><span style="text-transform:capitalize">${esc(mesTxt(f.per))}</span><b>${dinero(f.fact)}<br><small style="color:var(--ink3);font-weight:500">gastos ${dinero(f.gas)}</small></b></div>`).join('')}
    <div class="fila"><span><b style="color:var(--ink)">Total del año</b></span><b>${dinero(tf)}<br><small style="color:var(--ink3);font-weight:500">gastos ${dinero(tg)}</small></b></div></section>`;
}
function vistaAvisos() {

function pintar() {

      <div class="act"><span>Actualizado: ${esc(horaTxt(DATOS.generado))}</span>${SES && !SES.previa ? '<button data-accion="refrescar" aria-label="Actualizar información">↻ Actualizar</button>' : ''}</div></header>

document.addEventListener('click', ev => {

(async () => {
